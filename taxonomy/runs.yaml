        - type: CNT-03
          cause: software-side
          stage: prediction
    - id: T-040-b
      run_id: 2026-07-27_144417
      representation: text-only
      platform: mobile
      outcome: failed
      notes: >
        Faulty: the "Sort by price" control and the initial item list only
        order/show the currently-loaded page; this run reads the 6 items
        visible after one scroll without ever invoking "Load more" and
        reports the wrong cheapest item, missing the true minimum among the
        16 items that only appear after expanding the list (same wrong
        answer as run T-040-d). Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=5, status=human_failure,
        app_variant=faulty, trace=mobilerun\raw\gui-failure-suite-mobile-2888.
      failures:
        - type: CNT-03
          cause: software-side
          stage: prediction
    - id: T-040-c
      run_id: 2026-07-27_144703
      representation: vision-only
      platform: mobile
      outcome: succeeded
      notes: >
        Faulty, vision-only: unlike the text-only faulty runs, this run
        discovers and uses the "Load more" control to expand the
        page-scoped catalogue before identifying the cheapest item,
        independently arriving at the correct answer (Sponge Pack, \$6) —
        the same pattern confirmed in more detail in run T-040-f. Harness
        facts: agent=mobilerun,
        model=gemini-flash-latest, steps=10, status=success,
        app_variant=faulty, trace=mobilerun\raw\gui-failure-suite-mobile-2888.
      failures:
        - type: CNT-03
          cause: software-side
          stage: prediction
    - id: T-040-d
      run_id: 2026-07-27_144911
      representation: text-only
      platform: mobile
      outcome: failed
      notes: >
        Faulty, second replicate: same mechanism as run T-040-b — the agent
        reads only the 6 items visible after one scroll, never invokes
        "Load more", and reports the wrong cheapest item. Harness facts:
        agent=mobilerun,
        model=gemini-flash-latest, steps=5, status=human_failure,
        app_variant=faulty, trace=mobilerun\raw\gui-failure-suite-mobile-2888.
      failures:
        - type: CNT-03
          cause: software-side
          stage: prediction
    - id: T-040-e
      run_id: 2026-07-27_145049
      representation: text-only
      platform: mobile
      outcome: failed
      notes: >
        Faulty, clearest of the three text-only faulty runs: the agent does
        use the "Sort by price, low to high" control, then trusts the
        app's own footer text verbatim ("Cheapest shown: Sticky Notes \$8")
        and self-reports success — but that footer, like the sort itself,
        is scoped only to the currently-loaded page, so the answer is
        wrong; the true cheapest item (Sponge Pack, \$6) only appears after
        expanding the list via "Load more", which this run never invokes.
        Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=7, status=human_failure,
        app_variant=faulty, trace=mobilerun\raw\gui-failure-suite-mobile-2888.
      failures:
        - type: CNT-03
          cause: software-side
          stage: prediction
    - id: T-040-f
      run_id: 2026-07-27_145306
      representation: vision-only
      platform: mobile
      outcome: succeeded
      notes: >
        Faulty, vision-only: the agent uses "Load more" twice, scrolls to
        the bottom of the expanded catalogue, and explicitly double-checks
        for more items ("I will swipe down once more to confirm there are
        no additional items") before answering Sponge Pack (\$6) — the
        genuinely correct cheapest item, strictly cheaper than the
        page-scoped answer every text-only faulty run reported. This is not
        a false positive: by discovering and using "Load more," the
        vision-only agent found the actually-correct answer where the
        text-only agent trusted a page-scoped sort/footer. Harness facts:
        agent=mobilerun,
        model=gemini-flash-latest, steps=20, status=success,
        app_variant=faulty, trace=mobilerun\raw\gui-failure-suite-mobile-2888.
      failures:
        - type: CNT-03
          cause: software-side
          stage: prediction

