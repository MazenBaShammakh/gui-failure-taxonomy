# GUI Agent Failures — Tasks and Runs (v3)
#
# Generated from two sources:
#   * `taxonomy/v3/task_runs_01.json` (T-001..T-021) and
#     `taxonomy/v3/task_runs_02.json` (T-022..T-045) — the agent harness's
#     record of every attempt, split by collection batch. Together they
#     replace the former single `task_runs.json`. Supply every Run field
#     except `failures[]`.
#   * The Notion "Failure Taxonomy" database's `Tasks` relation — supplies
#     `failures[]`. That relation is TASK-level, so each of a task's runs
#     receives the same failure type(s); `cause`/`stage` on each edge are
#     the type's values from Notion (which match the F-*.yaml type records
#     exactly — checked at generation time).
#
# `source` sits on the TASK, not the Run — it describes the application the
# attempt targeted, which cannot differ between runs of one task:
#   localhost / com.mazenbashammakh -> controlled (our own instrumented
#     build, whether or not the fault was injected for that run)
#   any other gui-failure-suite target -> live (a real site, visited live)
#   everything else -> benchmark (the benchmark app as shipped)
#
# Tagging every run of a task, including runs that SUCCEEDED, is deliberate
# and follows v2: a run tags the failure it encountered, and `outcome`
# records whether that representation was defeated by it. That contrast
# (vision-only fails / multimodal succeeds on one task) is the RQ1 signal.
#
# Because the relation is task-level, a task whose runs genuinely hit
# DIFFERENT failures is over-tagged here — every run gets the union. v2 had
# exactly one such task out of 49, so expect few, but that is the known
# imprecision in this file. Narrow a run's `failures[]` by hand when the
# trace shows it met only some of them.
#
# `notes:` is a stub holding the harness facts worth keeping (agent, model,
# steps, stop_reason, error, trace path). Replace the TODO with the
# mechanism — what the agent did and why the GUI defeated it.
#
# T-022..T-045 (batch 02, gui-failure-suite-mobile-2860..2894) take their
# `failures[]` from the task->defect assignment supplied with that batch, not
# from a Notion query — same TASK-level granularity, same caveat above. 11
# assigned ids have no attempts in task_runs_02.json and so have no entry
# here yet: 2861, 2862, 2863, 2864, 2876, 2877, 2880, 2881, 2883, 2885, 2891.
# Batch 02 contains no `aborted` attempts; every attempt in it is recorded.
#
# Excluded from the source JSON: 40 attempts with `status: aborted`, and one
# `2026-04-07_183508` (gui-failure-suite-web-2835, multimodal) whose status,
# stop_reason, error_msg and duration are all null — nothing to map it to.
#
# `run_id` is the harness's BATCH id (`results/runs/<run_id>/`), not a unique
# per-run id: one batch can execute several tasks, one per line of the same
# .jsonl. Three run_ids here are each shared by two runs —
#   2026-06-01_222239  T-010-a + T-017-a
#   2026-06-09_143521  T-020-a + T-021-a
#   2026-06-09_153424  T-020-b + T-021-b
# — so match on `id` (T-NNN-x), never on `run_id`, when you need one run.
#
# Record shape: README.md ("Adding a new observation") and
# specs/taxonomy-structure.md (Task -> Run -> many-to-many failures[]).


