- id: T-006
  task_id: "gui-failure-suite-mobile-2766"
  app: "com.mazenbashammakh.mobile"
  task: "In the Tasks app, open All Tasks, scroll down, and mark \"Renew passport\" as done."
  source: controlled
  runs:
    - id: T-006-a
      run_id: 2026-06-29_161527
      representation: text-only
      platform: mobile
      outcome: succeeded
      notes: >
        Baseline: task rows carry stable, correctly-bound accessible names,
        so the agent scrolls to and marks "Renew passport" as done without
        difficulty. Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=6, status=success,
        app_variant=baseline,
        trace=mobilerun\raw\gui-failure-suite-mobile-2766.
      failures:
        - type: STR-01
          cause: software-side
          stage: prediction
    - id: T-006-b
      run_id: 2026-06-29_161647
      representation: text-only
      platform: mobile
      outcome: succeeded
      notes: >
        Faulty: the recycled-row pool means a rebound row's accessible name
        can lag its visible text once the list virtualizes, but in this run
        the agent still scrolls to and correctly marks "Renew passport" as
        done — the same defect produces a non-deterministic outcome across
        runs (contrast the retry loop in run T-006-d on the same variant).
        Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=6, status=success,
        app_variant=faulty,
        trace=mobilerun\raw\gui-failure-suite-mobile-2766.
      failures:
        - type: STR-01
          cause: software-side
          stage: prediction
    - id: T-006-c
      run_id: 2026-06-29_163355
      representation: text-only
      platform: mobile
      outcome: succeeded
      notes: >
        Baseline, second replicate run: task rows carry stable accessible
        names; the agent again marks "Renew passport" as done without
        difficulty, confirming baseline behavior. Harness facts:
        agent=mobilerun,
        model=gemini-flash-latest, steps=6, status=success,
        app_variant=baseline,
        trace=mobilerun\raw\gui-failure-suite-mobile-2766.
      failures:
        - type: STR-01
          cause: software-side
          stage: prediction
    - id: T-006-d
      run_id: 2026-06-29_163454
      representation: text-only
      platform: mobile
      outcome: failed
      notes: >
        Faulty, retry loop kept: the recycled row occupying "Renew
        passport"'s slot keeps the accessible name of whichever task first
        held that slot ("Call dentist" in this rendering), so the agent
        scrolls down repeatedly — four swipe attempts — never finding a row
        whose accessible name matches the target, and the run ends with no
        matching row ever clicked. Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=8, stop_reason=user_failure,
        status=human_failure, app_variant=faulty, error="Failure flagged by
        human observer (pressed 'f')",
        trace=mobilerun\raw\gui-failure-suite-mobile-2766.
      failures:
        - type: STR-01
          cause: software-side
          stage: prediction
    - id: T-006-e
      run_id: 2026-06-29_164303
      representation: vision-only
      platform: mobile
      outcome: succeeded
      notes: >
        Faulty, vision-only: the agent grounds on the correctly-updated
        rendered text rather than the stale accessible name, so the
        recycled-name defect has no effect on it — it scrolls to and marks
        "Renew passport" as done. Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=8, status=success,
        app_variant=faulty,
        trace=mobilerun\raw\gui-failure-suite-mobile-2766.
      failures:
        - type: STR-01
          cause: software-side
          stage: prediction

