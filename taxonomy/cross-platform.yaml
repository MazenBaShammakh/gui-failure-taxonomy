# GUI Agent Failures — Cross-Platform
#
# Failures observed in the progress updates that manifest across more than
# one platform (web + mobile, etc.) or that are platform-agnostic in nature.
# Entries are limited to failures with at least one concrete observation
# in a progress update between October 2025 and May 2026.

- id: F-XPL-MM-PRC-001
  platform: cross-platform
  agent_type: multimodal
  category: perceptibility
  failure: inaccessible_element_from_dom_or_a11y_tree
  description: >
    A visually rendered UI element (e.g. search bar, hero-section CTA,
    accordion header) has no corresponding actionable node in the DOM
    or a11y tree, so the multimodal agent cannot target it. The element
    is visible to humans but absent from the structured representation
    the agent consumes.
  assessment_ref: F1.1
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-XPL-MM-PRC-001-a
      source: live
      app: CarMax
      task: Find a 2022 Tesla Model 3.
      notes: >
        Agent could not detect the search bar under the navigation bar;
        no bounding box was produced for it (proposal, Failure Example 1,
        fig. 8).
    - scenario_id: F-XPL-MM-PRC-001-b
      source: live
      app: Ticketmaster
      task: Find a help page about "how presale works".
      notes: >
        Agent could not detect the CTA in the hero section (proposal,
        Failure Example 1, fig. 9).
    - scenario_id: F-XPL-MM-PRC-001-c
      source: live
      app: us.megabus
      task: Find out what to do when a person loses an item on a bus.
      notes: >
        Agent scrolled to the target accordion question but could not
        expand it — the accordion control is not exposed as an actionable
        node (proposal, Failure Example 2, fig. 10).
    - scenario_id: F-XPL-MM-PRC-001-d
      source: benchmark
      app: https://www.imdb.com
      task: Browse the list of top 250 movies and add the first one to my watchlist.
      notes: >
        Mind2Web mind2web-web-0987. Nothing on the page was selectable —
        no actionable node was produced for the list items the agent
        needed to target.

- id: F-XPL-VO-PRC-002
  platform: cross-platform
  agent_type: vision-only
  category: perceptibility
  failure: low_color_contrast
  description: >
    Element boundaries become hard to distinguish from background due to
    insufficient color contrast. Empirically, the vision-only agent
    succeeded down to a 1.23 contrast ratio — well below the WCAG AA
    threshold of 4.5 required for humans. The intuitive failure mode is
    therefore less frequent than expected; this is recorded both as a
    failure case and as an empirical contribution.
  assessment_ref: F1.4
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-XPL-VO-PRC-002-a
      source: live
      app: Perplexity
      task: Ask Perplexity about the latest multimodal LLMs.
      notes: >
        Send button has poor contrast between foreground and background
        (proposal, Failure Example 10, fig. 20).
    - scenario_id: F-XPL-VO-PRC-002-b
      source: controlled
      app: gui-failure-lab
      task: How many items are in my wishlist?
      notes: >
        Used to test the WCAG threshold empirically. Agent (gemini-2.5-flash,
        gemini-3-flash-preview, grok-4-fast-reasoning) succeeded at ratios
        as low as 1.23 (March 2026 (1), April 2026 (1)).

- id: F-XPL-MM-IDF-001
  platform: cross-platform
  agent_type: multimodal
  category: identifiability
  failure: non_clickable_element_styled_as_actionable
  description: >
    A decorative element visually mimics an interactive control (colored
    block, button-styled label, underlined text) but has no event handler
    and is not exposed as actionable. Multimodal agents that fuse vision
    with structured data still misidentify it as a target.
  assessment_ref: F2.4
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-XPL-MM-IDF-001-a
      source: controlled
      app: gui-failure-lab
      task: Send a message to the support team about reactivation of account.
      notes: >
        Multimodal agent (gemini-2.5-flash, gemini-3-flash-preview,
        grok-4-fast-reasoning) clicked an element that was styled as a CTA
        but had no handler (March 2026 (1)).

- id: F-XPL-MM-IDF-002
  platform: cross-platform
  agent_type: multimodal
  category: identifiability
  failure: clickable_element_confused_with_static_display
  description: >
    The agent cannot distinguish data-display elements from interactive
    controls. Observed when a static text region was treated as a button
    target, or when a real input control was treated as plain text.
  assessment_ref: F2.5
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-XPL-MM-IDF-002-a
      source: live
      app: undisclosed_support_form
      task: Send the support team a message about delayed delivery.
      notes: >
        Agent confused data-display elements with interaction elements
        (April 2026 (1), slide 11).
    - scenario_id: F-XPL-MM-IDF-002-b
      source: benchmark
      app: https://www.carmax.com
      task: search gas pickup truck in Fremont with 2010 and 2017 with less than 80000 mile
      notes: >
        Mind2Web mind2web-web-0980 (gemini-flash-latest). The year picker
        looks like a native <select> but is not one, so the agent's select
        interaction does not apply (the offered range also lacks a 2010
        option — a separate data-availability limit).

- id: F-XPL-VO-IDF-003
  platform: cross-platform
  agent_type: vision-only
  category: identifiability
  failure: overloaded_icon_multiple_purposes
  description: >
    A single icon carries more than one function (e.g. combined search +
    navigation-menu icon). The vision-only agent picks the wrong intent
    because the icon shape does not disambiguate the action.
  assessment_ref: F2.3
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-XPL-VO-IDF-003-a
      source: live
      app: BBC
      task: Search for an article titled "US Stock Markets".
      notes: >
        Single icon serves both search and navigation menu; agent triggered
        the navigation menu instead of the search input (proposal, Failure
        Example 12, fig. 22).

- id: F-XPL-MM-CNT-001
  platform: cross-platform
  agent_type: multimodal
  category: content_organization
  failure: cluttered_list_with_similar_items
  description: >
    The agent has to select from a long list of items with similar names,
    icons, or layout. Two distinct sub-cases observed: (1) the agent
    short-circuits and picks the first plausible item without reasoning
    over the list (Apple Watch case); (2) the agent reconsiders the list
    repeatedly without progressing (AccuWeather case).
  assessment_ref: F6.6
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-XPL-MM-CNT-001-a
      source: live
      app: Apple
      task: Compare Apple watches and learn more about the Ultra version.
      notes: >
        Agent navigated to a single watch detail page instead of selecting
        "Compare" from a long horizontal list (proposal, Failure Example 3,
        fig. 11).
    - scenario_id: F-XPL-MM-CNT-001-b
      source: live
      app: AccuWeather
      task: Find the weather in New York City.
      notes: >
        Multiple list items with near-identical "New York City" labels;
        agent stalled, reconsidering the list (proposal, Failure Example 3,
        fig. 12).
    - scenario_id: F-XPL-MM-CNT-001-c
      source: benchmark
      app: https://www.underarmour.com
      task: Search the cheapest Curry brand unisex athletic shoes with the number 5.5, add to cart and checkout.
      notes: >
        Mind2Web mind2web-web-0991. After correctly sorting the product
        list the agent scrolled past the first option and selected a
        not-cheapest shoe (apparently matched by name, e.g. "Curry 3Z 24"),
        short-circuiting on a plausible-looking item.

- id: F-XPL-MM-CNT-002
  platform: cross-platform
  agent_type: multimodal
  category: content_organization
  failure: missing_filter_or_sort_controls
  description: >
    A list page exposes no filter or sort controls, forcing the agent to
    scan the full list. When the default order does not match the implied
    ordering in the task ("latest"), the agent picks an incorrect item.
  assessment_ref: F6.3
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-XPL-MM-CNT-002-a
      source: live
      app: BBC
      task: Find the latest news about climate change.
      notes: >
        Results are not actually in descending chronological order and no
        sort control is exposed; agent picked a non-latest article
        (proposal, Failure Example 4, fig. 13).

- id: F-XPL-MM-CNT-003
  platform: cross-platform
  agent_type: multimodal
  category: content_organization
  failure: multilingual_content_mismatch
  description: >
    Page content is rendered in a language the agent is not configured to
    handle, blocking task progress. Cause leans joint — partly software
    design (locale not switched), partly model capability (monolingual
    handling).
  assessment_ref: F6.5
  cause: joint
  stage: prediction
  examples:
    - scenario_id: F-XPL-MM-CNT-003-a
      source: live
      app: Uniqlo
      task: Find a list of Men's Blazers, Black, Size M.
      notes: >
        Site rendered in German; agent stalled on the home page and did
        not click "Herren" (proposal, Failure Example 6, fig. 16).

- id: F-XPL-MM-SCP-001
  platform: cross-platform
  agent_type: multimodal
  category: interaction_scope
  failure: blocking_modal_with_tiny_or_no_close_affordance
  description: >
    A modal or popup intercepts interaction with the underlying page but
    exposes no usable close affordance, or the affordance is too small or
    appears too late to be detected. Agent either ignores the modal and
    continues acting on the obscured page, or stalls. Two sub-cases:
    (a) registration popup over an article (web); (b) upgrade popup
    appearing seconds after navigation (mobile).
  assessment_ref: F9.2
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-XPL-MM-SCP-001-a
      source: live
      app: BBC
      task: Find the latest news about climate change.
      notes: >
        Registration popup blocks the page; agent issues "Scroll Down"
        without closing it (proposal, Failure Example 5, fig. 14).
    - scenario_id: F-XPL-MM-SCP-001-b
      source: live
      app: LinkedIn (mobile)
      task: Get the latest post in my LinkedIn account.
      notes: >
        Upgrade popup appears seconds after navigation, after the DOM
        snapshot was taken; agent cannot retake the snapshot (proposal,
        Failure Example 5, fig. 15).
    - scenario_id: F-XPL-MM-SCP-001-c
      source: controlled
      app: gui-failure-lab
      task: Add an iPhone to the cart.
      notes: >
        Multimodal agent (gemini-2.5-flash, gemini-3-flash-preview,
        grok-4-fast-reasoning) failed to close a blocking modal before
        proceeding (March 2026 (1)).
    - scenario_id: F-XPL-MM-SCP-001-d
      source: benchmark
      app: https://www.tvguide.com
      task: Find more films from the director of Smile.
      notes: >
        Mind2Web mind2web-web-1013. Agent kept operating on the page behind
        a popup, ignoring it for several steps before eventually dismissing
        it. Boundary case: on IKEA (mind2web-web-1041, gpt-5) a cookie popup
        that did not block interaction was correctly ignored — the modal
        only becomes a failure when it intercepts input.

- id: F-XPL-VO-SCP-002
  platform: cross-platform
  agent_type: vision-only
  category: interaction_scope
  failure: invisible_clickable_overlay_captures_input
  description: >
    A transparent overlay (e.g. a sidebar backdrop) intercepts clicks
    intended for elements beneath. The vision-only agent has no signal
    that the overlay exists and continues to click coordinates that are
    captured by the hidden layer.
  assessment_ref: F9.1
  cause: software-side
  stage: execution
  examples:
    - scenario_id: F-XPL-VO-SCP-002-a
      source: live
      app: BBC
      task: Find a news article about EU relations.
      notes: >
        Sidebar open creates an invisible clickable overlay over the main
        content (proposal, Failure Example 9, fig. 19).

- id: F-XPL-MM-TMP-001
  platform: cross-platform
  agent_type: multimodal
  category: temporal_dynamics
  failure: popup_appears_after_snapshot
  description: >
    A popup, banner, toast, or notification bar is injected into the page
    after the agent has captured its DOM/visual snapshot. The agent acts
    on the stale snapshot and the action lands on the wrong target — or
    on the popup itself. Affects banners, notification bars, and toasts
    in addition to modals.
  assessment_ref: F8.1
  cause: software-side
  stage: execution
  examples:
    - scenario_id: F-XPL-MM-TMP-001-a
      source: live
      app: LinkedIn (mobile)
      task: Get the latest post in my LinkedIn account.
      notes: >
        Upgrade popup appears after DOM snapshot is captured; agent
        cannot retake (proposal, Failure Example 5, fig. 15).

- id: F-XPL-MM-NAV-001
  platform: cross-platform
  agent_type: multimodal
  category: navigation_discoverability
  failure: important_links_hidden_in_subtle_menu
  description: >
    Critical navigation links are placed inside a subtle dropdown or
    deeply nested menu, sometimes with no chevron or other visual
    indicator that a list is hidden. Some dropdowns also require hover
    rather than click, adding execution difficulty.
  assessment_ref: F5.1
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-XPL-MM-NAV-001-a
      source: live
      app: Yucca Packaging
      task: Find top selling cutlery.
      notes: >
        Cutlery link buried in a deeply nested navigation bar (proposal,
        Failure Example 11, fig. 21 left).
    - scenario_id: F-XPL-MM-NAV-001-b
      source: live
      app: BBC
      task: Find the latest news of England.
      notes: >
        England link inside a nested submenu (proposal, Failure Example 11,
        fig. 21 right).
    - scenario_id: F-XPL-MM-NAV-001-c
      source: benchmark
      app: https://www.uniqlo.com
      task: Show me the list of Men's Blazers, Black, Size M.
      notes: >
        Mind2Web mind2web-web-1019. Agent clicks the menu and it opens, but
        on the next step (mouse moved away) the hover-only menu collapses,
        so the target link is gone before it can be clicked. (Distinct from
        the German-locale stall catalogued for Uniqlo under F6.5.)
    - scenario_id: F-XPL-MM-NAV-001-d
      source: benchmark
      app: https://www.discogs.com
      task: Open the page with an overview about the submission of releases.
      notes: >
        Mind2Web mind2web-web-1034. Agent failed to hover over the
        "Community" tab bar but recovered via a longer path and eventually
        succeeded. Contrast: on mind2web-web-1035 (same site) the tab
        menuitem accepted a click rather than requiring hover.
