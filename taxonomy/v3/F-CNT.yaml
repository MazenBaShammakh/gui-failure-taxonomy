  category: content_organization
  failure: Cluttered List with Similar Items
  description: >
    The agent must choose from a long list of near-identical items -- it either
    short-circuits on the first plausible item or stalls, repeatedly
    reconsidering without progressing.
  facets:
    representation:
      expected: [vision-only]
    platform:
      expected: [web]
    cause: software-side
    stage: prediction
  remediation:
    fix: >
      TODO — no remediation recorded in Notion.
    helps: []

- id: F-CNT-03
  category: content_organization
  failure: Missing Filter or Sort Controls
  description: >
    A list page exposes no filter/sort controls, forcing a full scan; when the
    default order doesn't match the task's implied ordering (e.g. latest), the
    agent picks the wrong item.
  facets:
    representation:
      expected: [text-only, vision-only]
    platform:
      expected: [web]
    cause: software-side
    stage: prediction
  remediation:
    fix: >
      TODO — no remediation recorded in Notion.
    helps: []
