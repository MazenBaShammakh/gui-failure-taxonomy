# GUI Agent Failures — Mobile Platform
#
# Mobile-specific failures observed in the progress updates. Mobile
# manifestations of cross-platform failures (e.g. blocking modals on
# LinkedIn) live in cross-platform.yaml; this file holds failures whose
# mechanism is mobile-specific (gestures, touch targets, a11y metadata
# tied to mobile APIs, virtualized lists).

- id: F-MOB-MM-PRC-001
  platform: mobile
  agent_type: multimodal
  category: perceptibility
  failure: ghost_elements_in_a11y_tree
  description: >
    The mobile a11y tree contains bounding boxes for elements not
    currently visible on screen — typically a side effect of
    virtualized lists (RecyclerView), cached tabs, or off-screen
    container children. The agent is overwhelmed by phantom targets
    and may attempt to interact with elements that are not actually
    rendered.
  assessment_ref: F1.5
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-MOB-MM-PRC-001-a
      source: live
      app: home_screen_iOS
      task: Find the weather in Munich today.
      notes: >
        Starting screen exposed many bounding boxes for elements not
        visible on screen, including off-screen dock items and hidden
        widgets (proposal, Failure Example 7, fig. 17).

- id: F-MOB-VO-AFD-001
  platform: mobile
  agent_type: vision-only
  category: interaction_affordance
  failure: gesture_only_control_with_no_visual_cue
  description: >
    A control responds only to a non-tap gesture (swipe to delete,
    swipe to set rating, long-press to open) and exposes no visual hint
    of the gesture availability. The vision-only agent cannot discover
    the gesture from the screenshot alone — discovery depends entirely
    on embedded model knowledge about common mobile UI patterns.
  assessment_ref: F4.1
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-MOB-VO-AFD-001-a
      source: controlled
      app: gui-failure-lab
      task: Swipe-to-delete a list item.
      notes: >
        Vision-only path on the faulty screen had no visible indicator
        of the swipe affordance and failed to perform the gesture
        (May 2026 (1), Mobile Failure #1).

- id: F-MOB-MM-AFD-002
  platform: mobile
  agent_type: multimodal
  category: interaction_affordance
  failure: gesture_action_exposed_only_via_a11y_metadata
  description: >
    A gesture-driven control is reachable by the multimodal agent only
    because the underlying a11y tree exposes the gesture as an
    AccessibilityAction. When metadata is present the multimodal agent
    succeeds; absence of this metadata reduces it to the vision-only
    failure mode in F-MOB-VO-AFD-001. This entry captures the positive
    case (success contingent on metadata) — used to motivate F4.4 in
    the catalog.
  assessment_ref: F4.4
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-MOB-MM-AFD-002-a
      source: controlled
      app: gui-failure-lab
      task: Swipe-to-delete a list item.
      notes: >
        Multimodal path on the faulty screen succeeded because the swipe
        was exposed in the structured representation, while the
        vision-only path failed on the same screen (May 2026 (1)).

- id: F-MOB-VO-AFD-003
  platform: mobile
  agent_type: vision-only
  category: interaction_affordance
  failure: long_press_only_action_with_no_visual_cue
  description: >
    A bottom sheet or contextual menu can only be opened with a
    long-press, with no visual indicator (no "press and hold" hint, no
    chevron). The vision-only agent does not know the long-press
    affordance exists.
  assessment_ref: F4.7
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-MOB-VO-AFD-003-a
      source: controlled
      app: gui-failure-lab
      task: Open a contextual bottom sheet via long-press.
      notes: >
        Vision-only path on the faulty screen had no indication of the
        long-press affordance and could not open the bottom sheet
        (May 2026 (1), Mobile Failure #2).

- id: F-MOB-MM-AFD-004
  platform: mobile
  agent_type: multimodal
  category: interaction_affordance
  failure: long_press_action_exposed_only_via_a11y_metadata
  description: >
    Long-press affordance reachable by the multimodal agent only via
    the structured tree. Mirror entry to F-MOB-MM-AFD-002 for the
    long-press case rather than swipe.
  assessment_ref: F4.7
  cause: software-side
  stage: prediction
  examples:
    - scenario_id: F-MOB-MM-AFD-004-a
      source: controlled
      app: gui-failure-lab
      task: Open a contextual bottom sheet via long-press.
      notes: >
        Multimodal agent on the faulty screen opened the bottom sheet
        because the long-press was declared in the a11y tree
        (May 2026 (1)).

- id: F-MOB-MM-AFD-005
  platform: mobile
  agent_type: multimodal
  category: interaction_affordance
  failure: gesture_execution_failure_tap_interpreted_as_swipe
  description: >
    The agent intends a tap on a specific element but the execution
    layer interprets the action as a swipe, scroll, or other gesture.
    Often caused by gesture-sensitive regions adjacent to the target,
    or by a control implemented as swipeable when the agent expects it
    to be tappable (e.g. a time picker).
  assessment_ref: F4.1
  cause: joint
  stage: execution
  examples:
    - scenario_id: F-MOB-MM-AFD-005-a
      source: live
      app: clock_app
      task: Set a daily alarm at 9 PM.
      notes: >
        Agent intended to set 21:00; the action was executed as a swipe
        that resulted in 19:48 (proposal, Failure Example 8, fig. 18).
    - scenario_id: F-MOB-MM-AFD-005-b
      source: literature
      app: studyopedia_demo_app
      task: Rate to 4.5 stars.
      notes: >
        Motivating example from Sidong Feng's "Issues of GUIs" deck
        (Salehnamadi et al., Latte, CHI 2021): rating bar implemented
        as swipe, agent issues a click and the action fails.
