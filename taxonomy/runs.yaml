  task_id: "gui-failure-suite-mobile-2888"
  app: "com.mazenbashammakh.mobile"
  task: "In the Shop app, open Browse Categories and tell me the cheapest item under \"Popular this week\"."
  source: controlled
  runs:
    - id: T-040-a
      run_id: 2026-07-27_102151
      representation: text-only
      platform: mobile
      outcome: succeeded
      notes: >
        Baseline: the agent finds the cheapest "Popular this week" item
        without the page-scoping problem that affects the faulty variant's
        sort/list. Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=5, status=success,
        app_variant=baseline,
        trace=mobilerun\raw\gui-failure-suite-mobile-2888.
