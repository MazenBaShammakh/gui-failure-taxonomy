      TODO — no remediation recorded in Notion.
    helps: []

- id: F-PRC-04
  category: perceptibility
  failure: System Dialog Outside App-Scoped A11y Tree
  description: >
    A runtime permission prompt or OS dialog renders in a separate system
    window; an agent capturing only the foreground app's tree never receives
    its nodes and stalls behind an invisible blocker.
  facets:
    representation:
      expected: [text-only]
    platform:
      expected: [mobile]
    cause: software-side
    stage: prediction
  remediation:
