- id: F-PRC-06
  category: perceptibility
  failure: Low Color Contrast
  description: >
    Element boundaries are hard to distinguish from the background.
    Empirically weak effect -- agents succeeded down to a 1.23 contrast ratio,
    well below WCAG AA.
  facets:
