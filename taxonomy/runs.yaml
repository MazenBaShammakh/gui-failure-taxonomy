# GUI Agent Failures — Tasks and Runs (v3)
#
# Generated from two sources:
#   * `taxonomy/task_runs_01.json` (T-001..T-021),
#     `taxonomy/task_runs_02.json` (T-022..T-045) and
#     `taxonomy/task_runs_03.json` (T-046..T-055) — the agent harness's
#     record of every attempt, split by collection batch. Together they
#     replace the former single `task_runs.json`. Supply every Run field
#     except `failures[]`.
#   * The Notion "Failure Taxonomy" database's `Tasks` relation — supplies
#     `failures[]`. That relation is TASK-level, so each of a task's runs
#     receives the same failure type(s); `cause`/`stage` on each edge are
#     the type's values from Notion (which match the F-*.yaml type records
#     exactly — checked at generation time).
#
# `source` sits on the TASK, not the Run — it describes the application the
# attempt targeted, which cannot differ between runs of one task:
#   localhost / com.mazenbashammakh -> controlled (our own instrumented
#     build, whether or not the fault was injected for that run)
#   desktop.exe -> controlled as well. Batch 03 added it, and the rule
#     above keys on identifiers the desktop build simply doesn't use; it is
#     the same kind of target as the mobile one — our instrumented build,
#     shipped in `baseline` and `faulty` variants — so classifying it
#     `live` ("a real site") would be plainly wrong. Read the first rule as
#     "our own instrumented build, by whatever name it announces itself".
#   any other gui-failure-suite target -> live (a real site, visited live)
#   everything else -> benchmark (the benchmark app as shipped)
#
# Tagging every run of a task, including runs that SUCCEEDED, is deliberate
# and follows v2: a run tags the failure it encountered, and `outcome`
# records whether that representation was defeated by it. That contrast
# (vision-only fails / multimodal succeeds on one task) is the RQ1 signal.
#
# Because the relation is task-level, a task whose runs genuinely hit
# DIFFERENT failures is over-tagged here — every run gets the union. v2 had
# exactly one such task out of 49, so expect few, but that is the known
# imprecision in this file. Narrow a run's `failures[]` by hand when the
# trace shows it met only some of them.
#
# T-046..T-055 (batch 03, gui-failure-suite-desktop_windows-2896..2905) are
# the first DESKTOP runs in this file: agents `ufo` (text-only, UI-Automation
# tree) and `pc_agent` (vision-only, screenshots), model gemini-3.5-flash,
# every task run against both the `baseline` and the `faulty` build variant.
# Their `failures[]` come from the task->defect assignment supplied with that
# batch, not from a Notion query — same TASK-level granularity and the same
# caveat above. Four of the assigned types did not exist in the catalogue and
# were created from that assignment alone (see each file's header for what is
# and is not sourced from Notion): STR-02, FBK-02, INA-01, INS-04.
# One assigned id, 2895 (STR-01), has no attempts in task_runs_03.json and
# so has no entry here yet. Batch 03 contains no `aborted` attempts; every
# attempt in it is recorded.
#
# Batch 03 is also the first evidence on `desktop` for types whose
# `facets.platform.expected` reads `[web]` (TMP-02, PRC-04, IDT-01,
# IDT-03, NAV-02). That is not a contradiction to fix in the type files:
# `expected` is the Notion-sourced PREDICTION and `observed` is derived from
# these runs at read time (specs/taxonomy-structure.md §2.1). Widen
# `expected` upstream in Notion if the prediction itself is meant to change.
#
# `notes:` is a stub holding the harness facts worth keeping (agent, model,
# steps, stop_reason, error, trace path). Replace the TODO with the
# mechanism — what the agent did and why the GUI defeated it.
#
# T-022..T-045 (batch 02, gui-failure-suite-mobile-2860..2894) take their
# `failures[]` from the task->defect assignment supplied with that batch, not
# from a Notion query — same TASK-level granularity, same caveat above. 11
# assigned ids have no attempts in task_runs_02.json and so have no entry
# here yet: 2861, 2862, 2863, 2864, 2876, 2877, 2880, 2881, 2883, 2885, 2891.
# Batch 02 contains no `aborted` attempts; every attempt in it is recorded.
#
# Excluded from the source JSON: 40 attempts with `status: aborted`, and one
# `2026-04-07_183508` (gui-failure-suite-web-2835, multimodal) whose status,
# stop_reason, error_msg and duration are all null — nothing to map it to.
#
# `run_id` is the harness's BATCH id (`results/runs/<run_id>/`), not a unique
# per-run id: one batch can execute several tasks, one per line of the same
# .jsonl. Three run_ids here are each shared by two runs —
#   2026-06-01_222239  T-010-a + T-017-a
#   2026-06-09_143521  T-020-a + T-021-a
#   2026-06-09_153424  T-020-b + T-021-b
# — so match on `id` (T-NNN-x), never on `run_id`, when you need one run.
#
# Record shape: README.md ("Adding a new observation") and
# specs/taxonomy-structure.md (Task -> Run -> many-to-many failures[]).


- id: T-001
  task_id: "gui-failure-suite-mobile-2763"
  app: "com.mazenbashammakh.mobile"
  task: "In the Banking app, open Card Application, fill in the form, and submit your application."
  source: controlled
  runs:
    - id: T-001-a
      run_id: 2026-06-29_125439
      representation: text-only
      platform: mobile
      outcome: succeeded
      notes: >
        Baseline: the WebView accessibility bridge is wired, so the
        card-application form's Full name, Email address, and Submit
        controls are each exposed as individual nodes in the a11y tree; the
        text-only agent locates and fills every field directly and submits
        successfully. Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=5, status=success,
        app_variant=baseline,
        trace=mobilerun\raw\gui-failure-suite-mobile-2763.
      failures:
        - type: PRC-01
          cause: software-side
          stage: prediction
    - id: T-001-b
      run_id: 2026-06-29_125629
      representation: text-only
      platform: mobile
      outcome: failed
      notes: >
        Faulty: the WebView accessibility bridge is disabled, collapsing the
        whole embedded form into one opaque node with no child fields; the
        text-only agent cannot detect the Full name/Email address inputs or
        the Submit button and cannot complete the application. Harness
        facts: agent=mobilerun,
        model=gemini-flash-latest, steps=9, stop_reason=user_failure,
        status=human_failure, app_variant=faulty, error="Failure flagged by
        human observer (pressed 'f')",
        trace=mobilerun\raw\gui-failure-suite-mobile-2763.
      failures:
        - type: PRC-01
          cause: software-side
          stage: prediction
    - id: T-001-c
      run_id: 2026-06-29_130330
      representation: vision-only
      platform: mobile
      outcome: succeeded
      notes: >
        Faulty: the vision-only agent reads the rendered WebView content
        directly from pixels rather than the a11y tree, so the collapsed
        opaque node has no effect on it — it locates and fills the form
        fields visually and submits successfully. Harness facts:
        agent=mobilerun,
        model=gemini-flash-latest, steps=9, status=success,
        app_variant=faulty,
        trace=mobilerun\raw\gui-failure-suite-mobile-2763.
      failures:
        - type: PRC-01
          cause: software-side
          stage: prediction

- id: T-002
  task_id: "gui-failure-suite-mobile-2764"
  app: "com.mazenbashammakh.mobile"
  task: "In the Photos app, open Photo Details and add the photo to your Favorites."
  source: controlled
  runs:
    - id: T-002-a
      run_id: 2026-06-29_132644
      representation: text-only
      platform: mobile
      outcome: succeeded
      notes: >
        Baseline: the toolbar action cluster holding the Favorite button is
        exposed normally in the a11y tree, so the text-only agent opens
        Photo details and favorites the photo without incident. Harness
        facts: agent=mobilerun,
        model=gemini-flash-latest, steps=4, status=success,
        app_variant=baseline,
        trace=mobilerun\raw\gui-failure-suite-mobile-2764.
      failures:
        - type: PRC-02
          cause: software-side
          stage: prediction
    - id: T-002-b
      run_id: 2026-06-29_132741
      representation: text-only
      platform: mobile
      outcome: failed
      notes: >
        Faulty: the toolbar action cluster is marked not-important-for-a11y,
        withdrawing its whole subtree — including the Favorite button —
        from the tree. The agent opens Photo details, taps an unlabelled
        emoji-glyph node in place of the real cluster, then swipes searching
        for the action before the run ends without ever favoriting the
        photo. Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=7, stop_reason=user_failure,
        status=human_failure, app_variant=faulty, error="Failure flagged by
        human observer (pressed 'f')",
        trace=mobilerun\raw\gui-failure-suite-mobile-2764.
      failures:
        - type: PRC-02
          cause: software-side
          stage: prediction
    - id: T-002-c
      run_id: 2026-06-29_133431
      representation: vision-only
      platform: mobile
      outcome: failed
      notes: >
        Faulty, vision-only: same visually-identical faulty rendering as the
        task's other vision-only runs; this attempt terminates after a
        single step without reaching a resolution, too short to
        characterize the failure mode beyond the harness-recorded outcome.
        Harness facts: agent=mobilerun,
        model=gemini-3-pro-preview, steps=1, status=failure,
        app_variant=faulty,
        trace=mobilerun\raw\gui-failure-suite-mobile-2764.
      failures:
        - type: PRC-02
          cause: software-side
          stage: prediction
    - id: T-002-d
      run_id: 2026-06-29_133515
      representation: vision-only
      platform: mobile
      outcome: failed
      notes: >
        Faulty, vision-only: run aborted with a harness/runtime error before
        any step was recorded (steps=0) — an infrastructure failure, not
        behavioral evidence of how the agent handled the faulty screen.
        Harness facts: agent=mobilerun, model=gemini-pro,
        steps=0, status=error, app_variant=faulty,
        trace=mobilerun\raw\gui-failure-suite-mobile-2764.
      failures:
        - type: PRC-02
          cause: software-side
          stage: prediction
    - id: T-002-e
      run_id: 2026-06-29_133710
      representation: vision-only
      platform: mobile
      outcome: failed
      notes: >
        Faulty, vision-only, most informative run for this task: the agent
        does tap the visible heart icon and favorites the photo, but then
        cannot find a separate "Photo details" affordance and
        perception-loops on a three-dot menu it keeps mis-tapping at the
        same coordinates; the run ends without ever calling complete(), so
        despite favoriting the photo it does not finish the task. No
        vision-only run on this task self-reports success. Harness facts:
        agent=mobilerun, model=gemini-2.5-pro,
        steps=10, stop_reason=user_failure, status=human_failure,
        app_variant=faulty, error="Failure flagged by human observer
        (pressed 'f')", trace=mobilerun\raw\gui-failure-suite-mobile-2764.
      failures:
        - type: PRC-02
          cause: software-side
          stage: prediction

- id: T-003
  task_id: "gui-failure-suite-mobile-2765"
  app: "com.mazenbashammakh.mobile"
  task: "In the Maps app, open Current Location and center the map on your current location."
  source: controlled
  runs:
    - id: T-003-a
      run_id: 2026-06-29_150703
      representation: text-only
      platform: mobile
      outcome: succeeded
      notes: >
        Baseline: the location-permission system dialog is exposed in the
        app-scoped a11y tree, so the text-only agent perceives it directly
        and grants the permission, then centers the map. Harness facts:
        agent=mobilerun,
        model=gemini-flash-latest, steps=5, status=success,
        app_variant=baseline,
        trace=mobilerun\raw\gui-failure-suite-mobile-2765.
      failures:
        - type: PRC-03
          cause: software-side
          stage: prediction
    - id: T-003-b
      run_id: 2026-06-29_150811
      representation: text-only
      platform: mobile
      outcome: failed
      notes: >
        Faulty: the permission dialog renders identically but its node is
        withdrawn from the a11y tree the agent queries. It repeatedly
        re-taps "Use current location" and waits for the permission dialog
        to "appear," never perceiving that it is already blocking the
        screen; the run ends with no completion call. Harness facts:
        agent=mobilerun,
        model=gemini-flash-latest, steps=9, stop_reason=user_failure,
        status=human_failure, app_variant=faulty, error="Failure flagged by
        human observer (pressed 'f')",
        trace=mobilerun\raw\gui-failure-suite-mobile-2765.
      failures:
        - type: PRC-03
          cause: software-side
          stage: prediction
    - id: T-003-c
      run_id: 2026-06-29_151214
      representation: vision-only
      platform: mobile
      outcome: succeeded
      notes: >
        Faulty: the vision-only agent sees the permission dialog rendered on
        screen regardless of its a11y-tree status and answers it the way a
        human would, then centers the map successfully — the a11y omission
        that blocks the text-only agent has no effect on it. Harness facts:
        agent=mobilerun,
        model=gemini-flash-latest, steps=5, status=success,
        app_variant=faulty,
        trace=mobilerun\raw\gui-failure-suite-mobile-2765.
      failures:
        - type: PRC-03
          cause: software-side
          stage: prediction

- id: T-004
  task_id: "gui-failure-suite-mobile-2768"
  app: "com.mazenbashammakh.mobile"
  task: "In the Banking app, open Quick Actions and tap \"Pay Bills\"."
  source: controlled
  runs:
    - id: T-004-a
      run_id: 2026-06-30_181331
      representation: text-only
      platform: mobile
      outcome: succeeded
      notes: >
        Baseline: the text-only agent grounds on the Quick Actions tiles'
        a11y labels, which carry full label/role/bounds regardless of
        rendered contrast, and taps "Pay Bills" without issue. Harness
        facts: agent=mobilerun,
        model=gemini-flash-latest, steps=5, status=success,
        app_variant=baseline,
        trace=mobilerun\raw\gui-failure-suite-mobile-2768.
      failures:
        - type: PRC-05
          cause: software-side
          stage: prediction
    - id: T-004-b
      run_id: 2026-06-30_181416
      representation: text-only
      platform: mobile
      outcome: succeeded
      notes: >
        Faulty: label/background contrast on the tiles drops well below
        WCAG AA, but the text-only agent still grounds on the a11y label
        and role rather than rendered pixels, so the lowered contrast has
        no effect — it taps "Pay Bills" and succeeds identically to
        baseline. Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=5, status=success,
        app_variant=faulty,
        trace=mobilerun\raw\gui-failure-suite-mobile-2768.
      failures:
        - type: PRC-05
          cause: software-side
          stage: prediction
    - id: T-004-c
      run_id: 2026-06-30_182254
      representation: vision-only
      platform: mobile
      outcome: succeeded
      notes: >
        Baseline, vision-only: full-contrast tile grid, the agent navigates
        to Quick Actions and taps "Pay Bills" without difficulty (one
        incidental mis-tap along the way that it recovers from). Harness
        facts: agent=mobilerun,
        model=gemini-flash-latest, steps=7, status=success,
        app_variant=baseline,
        trace=mobilerun\raw\gui-failure-suite-mobile-2768.
      failures:
        - type: PRC-05
          cause: software-side
          stage: prediction
    - id: T-004-d
      run_id: 2026-06-30_182412
      representation: vision-only
      platform: mobile
      outcome: succeeded
      notes: >
        Faulty, vision-only: the label/background contrast on the tile grid
        drops to roughly 1.06:1 (well below the 3:1 WCAG AA floor). The
        agent mis-taps the wrong card once (step 4) but recovers, locates
        "Pay Bills" from the same low-contrast grid, and self-reports
        success — the hypothesis that low contrast would defeat a
        vision-only agent the way it would a human is not borne out. Harness
        facts: agent=mobilerun,
        model=gemini-flash-latest, steps=6, status=success,
        app_variant=faulty,
        trace=mobilerun\raw\gui-failure-suite-mobile-2768.
      failures:
        - type: PRC-05
          cause: software-side
          stage: prediction
    - id: T-004-e
      run_id: 2026-06-30_182626
      representation: vision-only
      platform: mobile
      outcome: succeeded
      notes: >
        Faulty, vision-only, second run: reaches the same self-reported
        success as run T-004-d in fewer steps and without the intervening
        mis-tap, corroborating that the low-contrast tiles do not defeat the
        vision-only agent. Harness facts: agent=mobilerun,
        model=gemini-flash-latest, steps=5, status=success,
        app_variant=faulty,
        trace=mobilerun\raw\gui-failure-suite-mobile-2768.
      failures:
        - type: PRC-05
          cause: software-side
          stage: prediction

