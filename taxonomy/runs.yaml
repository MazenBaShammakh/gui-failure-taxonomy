        never inspects that search's results — it abandons the filtered
        search and reverts to manually scrolling the full, unfiltered
        alphabetical app list, then self-terminates at step 15 with
        complete(success=false), concluding "the Twitter (or X) app is not
        installed." This is an agent-side entity-grounding failure, not a
        software defect: the app is present, but the agent never verifies
        its own "X" search. Harness facts: agent=mobilerun,
