# GUI Agent Failures — Interaction Affordance (v3)
#
# One file per category: every type in this file has
# `category: interaction_affordance` and an id of the form `F-INA-{NN}`. Which
# platform(s) a type applies to is a facet (`facets.platform`), not a file —
# that is the difference from v2, where files were mobile/web/desktop/
# cross-platform and the category lived only inside each entry.
#
# Empty by design — no failure types defined yet. See README.md ("Adding a
# new failure type") for the record shape, and specs/taxonomy-structure.md
# for the normative schema.
#
# `{NN}` is the next free number in THIS file (ids are category-scoped, and
# a category now lives in exactly one file, so a duplicate id is only
# possible within this file).
#
# Template — copy/paste below, uncomment, and fill in:
#
# - id: F-INA-NN
#   category: interaction_affordance
#   failure: Short Human-Readable Name
#   description: >
#     What the failure is and why it happens.
#   assessment_ref: candidate   # or an Fx.y ref into failure-assessment.md
#   facets:
#     representation:
#       expected: []            # subset of [text-only, vision-only, multimodal]
#     platform:
#       expected: []            # subset of [web, mobile, desktop]
#     cause: software-side      # software-side | agent-side | joint
#     stage: prediction         # prediction | execution | unclear
#   remediation:
#     fix: >
#       The proposed software-/design-side change.
#     helps: []                 # which representation(s) the fix unblocks

[]
